<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Opener Animation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f002b 0%, #1a0f3b 25%, #4a00e0 50%, #7c3aed 75%, #0f002b 100%);
            background-size: 400% 400%;
            animation: gradientShift 25s ease-in-out infinite;
            overflow: hidden;
            margin: 0;
            padding: 0;
            height: 100vh;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            25% { background-position: 100% 0%; }
            50% { background-position: 100% 100%; }
            75% { background-position: 0% 100%; }
        }

       body::before {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image:
        radial-gradient(4px 4px at 20px 30px, rgba(255,255,255,0.6), transparent),
        radial-gradient(4px 4px at 40px 70px, rgba(255,255,255,0.4), transparent),
        radial-gradient(3px 3px at 90px 40px, rgba(255,255,255,0.5), transparent),
        radial-gradient(3px 3px at 130px 80px, rgba(255,255,255,0.3), transparent),
        radial-gradient(4px 4px at 160px 30px, rgba(255,255,255,0.4), transparent),
        radial-gradient(3px 3px at 200px 60px, rgba(255,255,255,0.5), transparent),
        radial-gradient(4px 4px at 250px 90px, rgba(255,255,255,0.2), transparent),
        radial-gradient(5px 5px at 300px 20px, rgba(255,255,255,0.7), transparent),
        radial-gradient(2px 2px at 350px 100px, rgba(255,255,255,0.3), transparent);
    background-repeat: repeat;
    background-size: 400px 200px;
    animation: sparkle 35s linear infinite;
    pointer-events: none;
    z-index: -1;
    opacity: 0.7;
}

@keyframes sparkle {
    0% { transform: translateY(0px) rotate(0deg); opacity: 0.7; }
    100% { transform: translateY(-200px) rotate(360deg); opacity: 0; }
}

        .initial-hidden {
            opacity: 0;
            transform: translateY(0) scale(0.8);
            transition: all 2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .from-top { transform: translateY(-50px) scale(0.8); }
        .from-bottom { transform: translateY(50px) scale(0.8); }
        .from-left { transform: translateX(-50px) scale(0.8); }
        .from-right { transform: translateX(50px) scale(0.8); }

        .to-center {
            opacity: 1;
            transform: translate(0, 0) scale(1) !important;
        }
        
        /* Menghilangkan efek glow berulang dari welcome-text */
        #welcome-text.to-center {
            text-shadow: none;
            animation: none;
        }

        #portfolio-text.to-center {
            text-shadow: 
                0 0 10px rgba(255, 255, 255, 0.6), 
                0 0 20px rgba(138, 43, 226, 0.5), 
                0 0 30px rgba(255, 255, 255, 0.3);
            animation: textGlow 4s ease-in-out infinite alternate;
        }

        @keyframes textGlow {
            0% { text-shadow: 0 0 10px rgba(255,255,255,0.6), 0 0 20px rgba(138,43,226,0.5), 0 0 30px rgba(255,255,255,0.3); }
            100% { text-shadow: 0 0 20px rgba(255,255,255,0.8), 0 0 30px rgba(138,43,226,0.7), 0 0 40px rgba(255,255,255,0.4); }
        }

        @keyframes gradientText {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        @keyframes pulseFloat {
            0%, 100% { transform: translateY(0) scale(1) rotate(0deg); box-shadow: 0 0 15px rgba(255, 255, 255, 0.2); }
            25% { transform: translateY(-10px) scale(1.03) rotate(2deg); box-shadow: 0 0 25px rgba(255, 255, 255, 0.4); }
            50% { transform: translateY(-5px) scale(1.01); box-shadow: 0 0 20px rgba(255, 255, 255, 0.3); }
            75% { transform: translateY(-8px) scale(1.02) rotate(-2deg); box-shadow: 0 0 22px rgba(255, 255, 255, 0.35); }
        }

        .animate-continuous { animation: pulseFloat 6s ease-in-out infinite; }
        .animate-continuous:hover {
            animation-play-state: paused;
            transform: scale(1.15) !important;
            box-shadow: 0 0 35px rgba(255, 255, 255, 0.7);
            transition: all 0.4s cubic-bezier(0.25,0.46,0.45,0.94);
        }

        #url-text.to-center {
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.4));
            transition: all 0.5s ease;
        }

        #url-text:hover {
            filter: drop-shadow(0 0 12px rgba(255,255,255,0.6));
            transform: scale(1.05);
        }

        .fade-out { animation: fadeOutEffect 2.5s ease-out 11.5s forwards; }

        @keyframes fadeOutEffect {
            0% { opacity: 1; transform: scale(1); filter: blur(0px); }
            30% { opacity: 0.8; transform: scale(1.01); filter: blur(0.5px); }
            70% { opacity: 0.4; transform: scale(0.98); filter: blur(2px); }
            100% { opacity: 0; transform: scale(0.92); filter: blur(6px); }
        }

        /* Animasi huruf stagger untuk kedua title */
        .stagger-letters span {
            display: inline-block;
            opacity: 0;
            transform: translateY(20px) rotate(-5deg);
            transition: all 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .stagger-letters.animate span {
            opacity: 1;
            transform: translateY(0) rotate(0deg);
        }

        /* Delay untuk setiap huruf */
        .stagger-letters span:nth-child(1) { transition-delay: 0.1s; }
        .stagger-letters span:nth-child(2) { transition-delay: 0.2s; }
        .stagger-letters span:nth-child(3) { transition-delay: 0.3s; }
        .stagger-letters span:nth-child(4) { transition-delay: 0.4s; }
        .stagger-letters span:nth-child(5) { transition-delay: 0.5s; }
        .stagger-letters span:nth-child(6) { transition-delay: 0.6s; }
        .stagger-letters span:nth-child(7) { transition-delay: 0.7s; }
        .stagger-letters span:nth-child(8) { transition-delay: 0.8s; }
        .stagger-letters span:nth-child(9) { transition-delay: 0.9s; }
        .stagger-letters span:nth-child(10) { transition-delay: 1.0s; }
        .stagger-letters span:nth-child(11) { transition-delay: 1.1s; }
        .stagger-letters span:nth-child(12) { transition-delay: 1.2s; }
        .stagger-letters span:nth-child(13) { transition-delay: 1.3s; }
        .stagger-letters span:nth-child(14) { transition-delay: 1.4s; }
        .stagger-letters span:nth-child(15) { transition-delay: 1.5s; }
        .stagger-letters span:nth-child(16) { transition-delay: 1.6s; }
        .stagger-letters span:nth-child(17) { transition-delay: 1.7s; }
        .stagger-letters span:nth-child(18) { transition-delay: 1.8s; }
        .stagger-letters span:nth-child(19) { transition-delay: 1.9s; }
        .stagger-letters span:nth-child(20) { transition-delay: 2.0s; }

        /* MENGGANTI EFEK GLOW DENGAN EFEK SWEEP SEKALI JALAN */
        #welcome-text .stagger-letters span {
            position: relative;
            text-shadow: none; /* Hilangkan glow berulang pada span */
            animation: none; /* Pastikan tidak ada animasi berulang */
        }
        
        #welcome-text::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg, 
                transparent, 
                rgba(255,255,255,0.7), 
                rgba(255,255,255,0.9), 
                rgba(255,255,255,0.7), 
                transparent
            );
            background-size: 200% 100%;
            background-position: -150% 0;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: lightSweep 2.5s ease-in-out forwards;
            animation-delay: 2.5s;
        }

        @keyframes lightSweep {
            0% { background-position: -150% 0; }
            50% { background-position: 150% 0; }
            100% { background-position: 150% 0; opacity: 0; }
        }

        /* Gradient untuk portfolio spans */
        #portfolio-text .stagger-letters span {
            background-image: linear-gradient(45deg, #8A2BE2, #A0AEC0, #48BB78);
            -webkit-background-clip: text;
            -webkit-background-size: 200% 200%;
            background-size: 200% 200%;
            animation: gradientText 5s ease infinite;
            color: transparent;
            background-clip: text;
        }

        /* Hover effect untuk icons yang lebih smooth */
        .icon-hover {
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .icon-hover:hover {
            transform: translateY(-5px) rotate(5deg) scale(1.1);
            box-shadow: 0 10px 30px rgba(255, 255, 255, 0.3);
        }

        /* Improved responsiveness */
        @media (max-width: 640px) {
            .stagger-letters span {
                font-size: 0.8em;
            }
            body::before {
                background-size: 200px 100px;
            }
        }
    </style>
</head>
<body>

    <div id="main-container" class="fade-out flex flex-col justify-center items-center h-screen w-full p-4 md:p-8 text-white relative z-10">

        <div id="icons-group" class="mb-8 md:mb-12 flex flex-col sm:flex-row space-y-4 sm:space-y-0 sm:space-x-8 justify-center">
            <div id="icon1" class="initial-hidden from-top text-3xl md:text-4xl p-3 md:p-4 rounded-xl shadow-xl transition-all duration-500 cursor-pointer icon-hover"
                 style="color:#A0AEC0;background-color:rgba(255,255,255,0.1);backdrop-filter:blur(10px);">
                <i class="fas fa-code"></i>
            </div>
            <div id="icon2" class="initial-hidden from-top text-3xl md:text-4xl p-3 md:p-4 rounded-xl shadow-xl transition-all duration-500 cursor-pointer icon-hover"
                 style="color:#6366F1;background-color:rgba(255,255,255,0.1);backdrop-filter:blur(10px);">
                <i class="fas fa-user-circle"></i>
            </div>
            <div id="icon3" class="initial-hidden from-top text-3xl md:text-4xl p-3 md:p-4 rounded-xl shadow-xl transition-all duration-500 cursor-pointer icon-hover"
                 style="color:#48BB78;background-color:rgba(255,255,255,0.1);backdrop-filter:blur(10px);">
                <i class="fas fa-hammer"></i>
            </div>
        </div>

        <div class="titles text-center">
            <h1 id="welcome-text" class="initial-hidden from-left text-4xl sm:text-5xl md:text-6xl lg:text-8xl font-extrabold mb-2 md:mb-4 tracking-tight stagger-letters" style="color: white;">
                <span style="color: white;">W</span>
                <span style="color: white;">e</span>
                <span style="color: white;">l</span>
                <span style="color: white;">c</span>
                <span style="color: white;">o</span>
                <span style="color: white;">m</span>
                <span style="color: white;">e</span>
                <span style="color: white;"> </span>
                <span style="color: white;">t</span>
                <span style="color: white;">o</span>
                <span style="color: white;"> </span>
                <span style="color: white;">m</span>
                <span style="color: white;">y</span>
            </h1>

            <h1 id="portfolio-text" class="initial-hidden from-right text-4xl sm:text-5xl md:text-6xl lg:text-8xl font-extrabold tracking-tight stagger-letters"
                style="background-image: linear-gradient(45deg, #8A2BE2, #A0AEC0, #48BB78); -webkit-background-clip: text; -webkit-background-size: 200% 200%; background-size: 200% 200%; animation: gradientText 5s ease infinite; color: transparent;">
               <span style="color: white;">P</span>
                <span style="color: white;">o</span>
                <span style="color: white;">r</span>
                <span style="color: white;">t</span>
                <span style="color: white;">f</span>
                <span style="color: white;">o</span>
                <span style="color: white;">l</span>
                <span style="color: white;">i</span>
                <span style="color: white;">o</span>
                <span style="color: white;"> </span>
                <span style="color: white;">W</span>
                <span style="color: white;">e</span>
                <span style="color: white;">b</span>
                <span style="color: white;">s</span>
                <span style="color: white;">i</span>
                <span style="color: white;">t</span>
                <span style="color: white;">e</span>
            </h1>
        </div>

        <div id="url-text" class="initial-hidden from-bottom mt-6 md:mt-8">
            <p class="text-xs sm:text-sm md:text-base tracking-widest p-3 rounded-lg cursor-pointer transition-all duration-300 icon-hover" 
               style="color:rgba(255,255,255,0.8);background-color:rgba(255,255,255,0.05);backdrop-filter:blur(10px);"
               onclick="window.location.href='https://www.eki.my';">
                <i class="far fa-copyright mr-2"></i> Visit www.eki.my
            </p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const icon1 = document.getElementById('icon1');
            const icon2 = document.getElementById('icon2');
            const icon3 = document.getElementById('icon3');
            const welcomeText = document.getElementById('welcome-text');
            const portfolioText = document.getElementById('portfolio-text');
            const urlText = document.getElementById('url-text');
            const TRANSITION_DURATION = 2000;

            const startAnimation = (el) => {
                if (el) {
                    el.classList.remove('initial-hidden');
                    el.classList.add('to-center', 'animate');
                }
            };

            const iconDelays = [400, 800, 1200];
            [icon1, icon2, icon3].forEach((icon, i) => {
                setTimeout(() => startAnimation(icon), iconDelays[i]);
            });

            // Welcome Text (from left + letter stagger)
            setTimeout(() => startAnimation(welcomeText), 1400);

            // Portfolio Text (from right + letter stagger)
            setTimeout(() => startAnimation(portfolioText), 1800);

            setTimeout(() => startAnimation(urlText), 2400);

            const continuousDelay = iconDelays[2] + TRANSITION_DURATION + 300;
            setTimeout(() => {
                [icon1, icon2, icon3].forEach(icon => icon.classList.add('animate-continuous'));
            }, continuousDelay);

            // Smooth redirect with fade-out already handling the exit
            setTimeout(() => {
                window.location.href = 'index1.html';
            }, 14000);
        });
    </script>
</body>
</html>

<style>
    /* Responsif dan perataan ikon tanpa ubah struktur HTML */
#icons-group {
  flex-wrap: wrap;
  align-items: center;
}

#icons-group > div {
  width: 65px;
  height: 65px;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Ukuran kecil (HP) */
@media (max-width: 640px) {
  #icons-group {
    flex-direction: row !important;
    flex-wrap: wrap;
    justify-content: center;
    gap: 1rem;
    margin-bottom: 1.5rem;
  }

  #icons-group > div {
    width: 55px !important;
    height: 55px !important;
    font-size: 1.6rem !important;
    padding: 0.5rem !important;
    border-radius: 0.9rem !important;
  }
}

/* Layar sangat kecil (di bawah 400px) */
@media (max-width: 400px) {
  #icons-group > div {
    width: 48px !important;
    height: 48px !important;
    font-size: 1.4rem !important;
    margin: 0.3rem 0;
  }
}

</style>
